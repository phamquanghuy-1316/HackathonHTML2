<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Quản Lý Sự Kiện</h1>
    <form onsubmit="handleSubmit(event)" class="was-validated">
        <div class="inputbox">
            <label for="inputname"><b>Tên sự kiện:</b></label>
            <input required type="text" id="inputname" name="inputname">
            <div class="invalid-feedback">
                Không được để trống.
            </div>
        </div>
        <div class="inputbox">
            <label for="inputdate"><b>Ngày tổ chức:</b></label>
            <input required type="date" id="inputdate" name="inputdate">
            <div class="invalid-feedback">
               Vui lòng chọn ngày.
            </div>
        </div>
        <div class="inputbox">
            <label for="inputaddress"><b>Địa điểm:</b></label>
            <input required type="text" id="inputaddress" name="inputaddress">
            <div class="invalid-feedback">
                Không được để trống.
            </div>
        </div>
        <div class="inputbox">
            <label for="inputhost"><b>Người tổ chức:</b></label>
            <input required type="text" id="inputhost" name="inputhost">
            <div class="invalid-feedback">
                Không được để trống.
            </div>
        </div>
        <div class="submitbtn">
            <button type="submit" class="btn btn-success">Thêm/sửa sự kiện</button>
        </div>
    </form>

    <div class="listcontainer">
        <input type="text" placeholder="Tìm kiếm theo tên sự kiện..." id="searchEvent" name="searchEvent" onkeyup="searchEvent()" on>
        <table class="table">
            <thead>
              <tr>
                <th scope="col">Tên sự kiện</th>
                <th scope="col">Ngày</th>
                <th scope="col">Địa điểm</th>
                <th scope="col">Người tổ chức</th>
                <th scope="col">Hành động</th>
              </tr>
            </thead>
            <tbody class="table-group-divider">
              
            </tbody>
          </table>
    </div>
    
    <script src="https://kit.fontawesome.com/7b988689d5.js" crossorigin="anonymous"></script>
    <script src="./main.js"></script>
</body>
</html>
